[project]
name = "fine-tuning"
version = "0.2.0"
description = "Fine-tune Qwen3.5 with Unsloth (LoRA) to turn parsed PDFs into ETS trait TSVs for BioParser"
readme = "README.md"
authors = [
    { name = "Kristjan Kaasik", email = "155821871+ChrisKK04@users.noreply.github.com" }
]
# Tested on CPython 3.13 (the RTX 2060 run used 3.13.15). The stack below has no
# verified 3.14 combination, so uv refuses other versions instead of guessing.
requires-python = ">=3.13,<3.14"
dependencies = [
    # GPU training stack, pinned to the combination that ran on the RTX 2060:
    # Unsloth 2026.11.1, transformers 5.2.0, TRL 0.22.2, torch 2.14.1+cu130.
    # unsloth 2026.11.1 requires transformers<=5.17.0, trl<=1.15.0, datasets<5,
    # torch<2.15. The previous pins (transformers>=5.20.2, trl>=1.16.0,
    # datasets>=5.1.0) could not be installed together with Unsloth, which is
    # why the notebook pip-installed packages into the venv behind uv's back.
    # transformers 5.17.0 replaces 5.2.0, because 5.2.0 has 4 security advisories
    # (GHSA-29pf-2h5f-8g72, GHSA-fgcw-684q-jj6r, GHSA-xrqw-3rrv-vx5w, GHSA-x9r9-c232-4q39).
    # 5.17.0 is the newest version that unsloth 2026.11.1 accepts.
    "unsloth==2026.11.1",
    "unsloth-zoo==2026.11.1",
    "torch==2.14.1",
    "transformers==5.17.0",
    "trl==0.22.2",
    "datasets>=4.3,<5",
    "peft>=0.18",
    "accelerate>=1.10",
    "bitsandbytes>=0.45.5", # optim="adamw_8bit"
    "torchao>=0.16",
]

[dependency-groups]
# The same minimum versions as the bioparser repository
dev = ["mypy>=2.3.1", "pre-commit>=4.6.2", "pytest>=9.1.1", "ruff>=0.16.5"]
# "lab" (previously listed) is an unrelated benchmark-experiment framework on PyPI,
# not JupyterLab.
notebook = ["jupyterlab>=4.4", "ipykernel>=6.29", "ipywidgets>=8.1"]
# Packages for bioparser-fetch-pdfs. For the browser modes, also run: uv run playwright install chromium
fetch = ["httpx>=0.28", "beautifulsoup4>=4.12", "pypdf>=5.0", "playwright>=1.50"]

[project.scripts]
bioparser-build-dataset = "bioparser_ft.build_dataset:main"
bioparser-train = "bioparser_ft.train:main"
bioparser-predict = "bioparser_ft.infer:main"
bioparser-evaluate = "bioparser_ft.evaluate:main"
bioparser-fetch-pdfs = "bioparser_ft.fetch.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "notebook", "fetch"]

[tool.uv.build-backend]
module-name = "bioparser_ft"

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI does not install the package, because its dependencies are the GPU training stack.
# For this reason, the tests import the package from src/.
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"
# The original Unsloth tutorial is a reference, not the code of this repository (notebooks/README.md).
# force-exclude: the exclusion also applies to the files that pre-commit gives to ruff.
extend-exclude = ["notebooks/Qwen3_5_0_8B_original_tutorial.ipynb"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"] # long lines in prompt text; Unicode in docs is intended

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src,tests"
explicit_package_bases = true

[[tool.mypy.overrides]]
# The GPU training stack. CI does not install it, and some of these packages have no type hints.
# follow_imports = "skip" gives the same result on a computer that has the stack.
module = [
    "accelerate.*",
    "bitsandbytes.*",
    "datasets.*",
    "huggingface_hub.*",
    "peft.*",
    "tokenizers.*",
    "torch.*",
    "transformers.*",
    "trl.*",
    "unsloth.*",
    "unsloth_zoo.*",
]
ignore_missing_imports = true
follow_imports = "skip"
